version: "2"
sql:
  - &owner
    engine: sqlite
    schema: module/sql/migrations
    queries: module/sql/queries.sql
    gen:
      go: &go
        package: module
        out: module
        emit_json_tags: true
        json_tags_case_style: camel
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        output_db_file_name: sqlc_db.go
        output_models_file_name: sqlc_models.go
        output_files_suffix: _sqlc
  - <<: *owner
    schema: device/sql/migrations
    queries: device/sql/queries.sql
    gen:
      go:
        <<: *go
        package: device
        out: device
  - <<: *owner
    schema: modules/weather/sql/migrations
    queries: modules/weather/sql/queries.sql
    gen:
      go:
        <<: *go
        package: weather
        out: modules/weather
  - <<: *owner
    schema: modules/eveonline/status/sql/migrations
    queries: modules/eveonline/status/sql/queries.sql
    gen:
      go:
        <<: *go
        package: status
        out: modules/eveonline/status
  - <<: *owner
    schema: modules/eveonline/esi/sql/migrations
    queries: modules/eveonline/esi/sql/queries.sql
    gen:
      go:
        <<: *go
        package: esi
        out: modules/eveonline/esi
  - <<: *owner
    schema: modules/eveonline/sde/sql/migrations
    queries: modules/eveonline/sde/sql/queries.sql
    gen:
      go:
        <<: *go
        package: sde
        out: modules/eveonline/sde
