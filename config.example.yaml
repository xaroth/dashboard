listen:
  device: "0.0.0.0:8080"
  admin: "127.0.0.1:8081"   # bind to a trusted interface only
public_url: http://127.0.0.1:8080   # base for image_url, reachable from the devices
timezone: Europe/Amsterdam
data_dir: ./data

devices:
  hallway:
    mac: "AA:BB:CC:DD:EE:01"
    rotation: 0
    pages: [weather, hello]

renderer:
  watch: true   # rebuild pages on change; reload the browser to see them

modules:
  weather:
    location: "Uithoorn, The Netherlands"   # geocoded once, coordinates cached
    model: knmi_seamless   # KNMI HARMONIE for 2.5 days, then ECMWF; omit to let Open-Meteo pick
