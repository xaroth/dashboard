listen:
  device: "0.0.0.0:8080"
  admin: "127.0.0.1:8081"   # no authentication; bind to a trusted interface only
public_url: http://127.0.0.1:8080   # required; base for image_url, reachable from the devices
timezone: Europe/Amsterdam
data_dir: ./data   # holds dashboard.sqlite: module state, caches, device API keys

# Timer wakes, local time; these are the defaults.
# schedule:
#   first_wake: "07:00"
#   last_wake: "00:00"
#   interval_battery: 1h
#   interval_usb: 5m
#   detail_timeout: 5m   # how long a page shown after a button press stays up

devices:
  hallway:
    mac: "AA:BB:CC:DD:EE:01"
    rotation: 0   # 0, 90, 180 or 270
    layout: e1001   # pages/layouts/e1001/; pages not in it come from pages/shared/
    pages: [home, weather, energy, energy_day, calendar, eveonline, eveonline_skills, rss, hello]   # the first is the main page; a button press shows the next
    # power: usb   # auto (default) follows USB-Connected, which the reTerminals do not send, and assumes battery
    # params:   # query param overrides, <page>.<data key>
    #   rss.feed: {feed: tech}   # the rss page shows the first feed by name unless set
    #   car.car: {id: ioniq}   # the car page's car, by short name or VIN; the first car without it
    #   home.news: {feed: tech}   # the news row on home, like rss.feed
    #   home.car: {id: ioniq}   # the car on the E1001 home, like car.car
  living_room:
    mac: "AA:BB:CC:DD:EE:02"
    layout: e1003   # 1872x1404; shared pages are scaled up to fill it
    pages: [home, calendar, weather, energy, eveonline_skills]

renderer:
  watch: true   # rebuild pages on change; reload the browser to see them

modules:
  weather:
    location: "Amsterdam, The Netherlands"   # geocoded on first update, coordinates cached per value
    model: knmi_seamless   # KNMI HARMONIE for 2.5 days, then ECMWF; omit to let Open-Meteo pick
  eveonline_esi:   # ESI client shared by the eveonline_* modules
    contact: ["mailto:you@example.com"]   # required; sent in the User-Agent
    # SSO application from developers.eveonline.com, for character logins at /eveonline_esi/ on the admin listener
    # client_id: ...
    # client_secret: ...
    # callback_url: http://127.0.0.1:8081/eveonline_esi/callback   # must match the application's callback
  calendar:   # iCal feeds by name, e.g. Google Calendar's secret address in iCal format
    # calendars:   # empty disables the module
    #   family: {url: "${CALENDAR_FAMILY_ICAL}"}   # the URL is a credential: keep it in the environment
    #   work: {url: "${CALENDAR_WORK_ICAL}", muted: true}   # muted: shown in gray
  car:   # Pleos Vehicle Data API; enter keys on /car/ on the admin listener
    # active_interval: 15m   # while a car is on, charging or moving
    # max_interval: 12h      # a parked car is polled every quarter of its idle time, up to this
  p1:   # Smartstuff P1 dongle, DSMR-API firmware
    # url: http://192.168.1.20   # empty disables the module
  solar:   # Hoymiles DTU-Pro-S over Modbus TCP
    # host: 192.168.1.21   # empty disables the module
    # unused: ["100000000687:1"]   # inputs without a panel, serial:port
  rss:   # RSS, Atom and JSON feeds by name; pages pick one with the feed param
    feeds:
      news: { url: "https://feeds.nos.nl/nosnieuwsalgemeen" }
      # tech: { url: "https://example.org/atom.xml" }
